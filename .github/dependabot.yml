version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /.github/site-checks
    # With "/" the branch would have a ".github" path component, which git
    # rejects; Dependabot's update failed with "invalid or unauthorized changes".
    pull-request-branch-name:
      separator: "-"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
